<div class="nota-fiscal-lista-container">
  <h1>Notas Fiscais</h1>

  <button mat-flat-button color="primary" routerLink="/notas-fiscais/nova">Nova Nota Fiscal</button>

  @if (carregando) {
    <mat-spinner diameter="40"></mat-spinner>
  } @else {
    <table mat-table [dataSource]="notas" class="mat-elevation-z2">

      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef>Número</th>
        <td mat-cell *matCellDef="let nota">{{ nota.numero }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let nota">
          <mat-chip [color]="nota.status === StatusNotaFiscal.Aberta ? 'accent' : 'primary'" selected>
            {{ nota.status === StatusNotaFiscal.Aberta ? 'Aberta' : 'Fechada' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="itens">
        <th mat-header-cell *matHeaderCellDef>Itens</th>
        <td mat-cell *matCellDef="let nota">{{ nota.itens.length }} produto(s)</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let nota">
          @if (nota.status === StatusNotaFiscal.Aberta) {
            <button
              mat-flat-button
              color="primary"
              [disabled]="imprimindoId === nota.id"
              (click)="imprimir(nota.id)">
              @if (imprimindoId === nota.id) {
                <mat-spinner diameter="18"></mat-spinner>
              } @else {
                Imprimir
              }
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunasExibidas;"></tr>
    </table>
  }
</div>
